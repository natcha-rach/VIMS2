<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>จัดการล็อต | ระบบร้านเสื้อมือสอง</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Kanit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/lots.css" />
  </head>
  <body>
    <nav id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <span class="brand-mark">👕</span
          ><span class="brand-text">Bubbles <span>Gumps</span></span>
        </div>
        <button
          id="navCollapse"
          class="nav-collapse"
          aria-label="ย่อ/ขยายเมนู"
          title="ย่อ/ขยายเมนู"
        >
          ‹
        </button>
      </div>
      <div class="sidebar-links">
        <a href="index.html" title="ภาพรวม"
          ><span class="icon">📊</span><span class="label">ภาพรวม</span></a
        >
        <a href="lots.html" title="ล็อต"
          ><span class="icon">📦</span><span class="label">ล็อต</span></a
        >
        <a href="items.html" title="สินค้า"
          ><span class="icon">👕</span><span class="label">สินค้า</span></a
        >
        <a href="sell.html" title="ขายของ"
          ><span class="icon">💰</span><span class="label">ขายของ</span></a
        >
        <a href="reports.html" title="รายงาน"
          ><span class="icon">📅</span><span class="label">รายงาน</span></a
        >
        <a href="accounting.html" title="บัญชี"
          ><span class="icon">🧾</span><span class="label">บัญชี</span></a
        >
      </div>
    </nav>

    <div id="mainWrap">
      <div class="topbar">
        <div class="subtitle">จัดการล็อต</div>
      </div>

      <div class="page">
        <h1>เพิ่มล็อตใหม่</h1>
        <p style="color: var(--color-ink-soft); margin-top: 0">
          1 ล็อต = 1 ครั้งที่รับเสื้อเข้ามา
        </p>

        <div class="tag-card">
          <form id="lotForm">
            <div class="field">
              <label for="lotName">ชื่อ/รหัสล็อต</label>
              <input
                type="text"
                id="lotName"
                placeholder="เช่น ล็อตกระสอบเหมา ส.ค. 69"
                required
              />
            </div>
            <div class="field-row">
              <div class="field">
                <label for="purchaseDate">วันที่ซื้อ</label>
                <input type="date" id="purchaseDate" required />
              </div>
              <div class="field">
                <label for="source">แหล่งที่มา</label>
                <input type="text" id="source" placeholder="ชื่อร้าน/ตลาด" />
              </div>
            </div>
            <div class="field-row">
              <div class="field">
                <label for="totalCost">ต้นทุนรวมทั้งล็อต (บาท)</label>
                <input
                  type="number"
                  id="totalCost"
                  step="0.01"
                  min="0"
                  required
                />
              </div>
              <div class="field">
                <label for="totalItems">จำนวนชิ้นทั้งหมด</label>
                <input type="number" id="totalItems" min="0" required />
              </div>
            </div>
            <div class="field">
              <label for="note">หมายเหตุ</label>
              <textarea id="note" rows="2"></textarea>
            </div>
            <!-- รูปกระสอบ/ล็อตตอนรับเข้า อัปโหลดขึ้น Cloudinary ทันที (เหมือนกลไกในหน้า items.html) -->
            <div class="field">
              <label for="lotImageFile">รูปกระสอบ/ล็อต (ถ้ามี)</label>
              <div class="image-upload-field">
                <img id="lotImagePreview" class="image-preview" style="display: none" />
                <input type="file" id="lotImageFile" accept="image/*" capture="environment" />
              </div>
              <div class="image-upload-status" id="lotImageStatus"></div>
            </div>
            <div class="field-row">
              <button
                type="button"
                class="btn btn-ghost hidden"
                id="cancelLotEdit"
                style="flex: 1"
              >
                ยกเลิกแก้ไข
              </button>
              <button
                type="submit"
                class="btn btn-primary"
                id="lotSubmitBtn"
                style="flex: 2"
              >
                บันทึกล็อต
              </button>
            </div>
          </form>
        </div>

        <h2 style="margin-top: 24px">ล็อตทั้งหมด</h2>
        <div id="lotList"><div class="empty-state">กำลังโหลด...</div></div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- apiClient.js แทนที่ supabase-js CDN + supabaseClient.js เดิมทั้งคู่ -->
    <!-- (ไม่ต้องมี CDN ของ Supabase อีกต่อไป เพราะไม่ได้คุยกับ Supabase ตรงๆ แล้ว) -->
    <script src="assets/js/apiClient.js"></script>
    <script src="assets/js/nav.js"></script>
    <script src="assets/js/lots.js"></script>
  </body>
</html>
